name: rtms

services:
  database:
    image: postgis/postgis:17-3.5-alpine
    container_name: rtms_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtms}
      POSTGRES_USER: ${POSTGRES_USER:-rtms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtms_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtms} -d ${POSTGRES_DB:-rtms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - rtms_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtms_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-rtms}:${POSTGRES_PASSWORD:-rtms_dev_password}@database:5432/${POSTGRES_DB:-rtms}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rtms_net

  frontend:
    build:
      context: ../RTMS_FE
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}/api/v1
    container_name: rtms_frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rtms_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: rtms_n8n
    entrypoint: /bin/sh
    command: -c "n8n import:workflow --separate --input=/workflows && n8n publish:workflow --id=rtms-port-deadline && n8n publish:workflow --id=rtms-vessel-timeout && n8n publish:workflow --id=rtms-booking-expired || true; exec /docker-entrypoint.sh"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    restart: unless-stopped
    networks:
      - rtms_net

volumes:
  postgres_data:
  n8n_data:

networks:
  rtms_net:
    driver: bridge
